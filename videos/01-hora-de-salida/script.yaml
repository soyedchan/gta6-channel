scenes:
  - type: title
    chapter: "Intro"
    kicker: "Guía de lanzamiento"
    title: "GTA 6 YA ESTÁ AQUÍ"
    subtitle: "Hora de desbloqueo y qué hacer si no te deja jugar"
    say:
      - "GTA 6 ya está disponible, pero mucha gente se está encontrando con lo mismo: el juego descargado y la consola diciendo que todavía no."
      - "En este vídeo te explico a qué hora se desbloquea en tu país y las seis soluciones que funcionan si no te deja jugar."
  - type: stat
    chapter: "A qué hora se desbloquea"
    kicker: "La regla oficial"
    heading: "Medianoche, hora local"
    value: "00:00"
    label: "Jueves 19 de noviembre de 2026"
    detail: "PS5 y Xbox Series X|S · según la web de soporte de Rockstar"
    detail_at: 1
    source: "Rockstar Games Support"
    say:
      - "La regla que da Rockstar es sencilla: GTA 6 se lanza a medianoche, hora local, el jueves diecinueve de noviembre, en PS5 y en Xbox Series X y Series S."
      - "Es un lanzamiento escalonado. Cada país lo desbloquea cuando su reloj marca las doce de la noche. Por eso Nueva Zelanda fue de los primeros del mundo en jugar."
  - type: table
    kicker: "Hora local de desbloqueo"
    heading: "Cuándo te toca a ti"
    rows:
      - ["España (península)", "00:00 del jueves 19", true]
      - ["México (centro)", "00:00 del jueves 19"]
      - ["Argentina · Chile", "00:00 del jueves 19"]
      - ["Colombia · Perú", "00:00 del jueves 19"]
      - ["EE. UU. (PlayStation, reportado)", "00:00 ET · 21:00 PT del miércoles"]
    at: [1, 1, 1, 1, 2]
    source: "Rockstar Games Support · Tech Times (EE. UU., no oficial)"
    say:
      - "¿Qué significa en la práctica?"
      - "Que en España, México, Argentina, Chile, Colombia o Perú, la hora es la misma para todos: las doce de la noche de tu propio país."
      - "La excepción está en Estados Unidos. Varios medios informan de que la tienda de PlayStation usa una sola hora para todo el país, la medianoche de la costa este, así que en la costa oeste se podría jugar desde las nueve de la noche del miércoles. Rockstar no lo ha confirmado, tómalo como un dato no oficial."
  - type: quote
    label: "Ojo"
    text: "Si ya es día 19 en tu país y no arranca, el problema está en tu consola, no en la hora."
    color: [255, 214, 64]
    say:
      - "Así que si ya es día diecinueve donde vives y el juego no arranca, el problema casi seguro no es la hora. Vamos con las soluciones, de la más rápida a la más pesada."
  - type: checklist
    chapter: "6 soluciones si no te deja jugar"
    kicker: "Soluciones 1 a 3"
    heading: "Si no te deja jugar"
    items:
      - {text: "Comprueba la descarga y el parche del día uno", sub: "La precarga no basta: tiene que estar al 100 % y actualizada"}
      - {text: "Pon la fecha y la hora automáticas", sub: "Una hora mal puesta bloquea el desbloqueo"}
      - {text: "Revisa tu consola principal", sub: "PS5: compartir consola y jugar sin conexión · Xbox: Mi Xbox principal"}
    say:
      - "Primero, las tres más rápidas."
      - "Uno: entra en la ficha del juego y comprueba que la descarga está al cien por cien. Muchas consolas tienen que bajar todavía la actualización del día uno antes de dejarte entrar."
      - "Dos: revisa que la fecha y la hora de la consola estén en automático. Si la tienes cambiada a mano, la consola puede pensar que aún no es el día de salida."
      - "Tres: si compraste el juego digital con tu cuenta pero juegas en otra consola, actívala como principal. En PS5 es la opción compartir consola y jugar sin conexión. En Xbox se llama Mi Xbox principal."
  - type: checklist
    kicker: "Soluciones 4 a 6"
    heading: "Si sigue sin funcionar"
    items:
      - {text: "Restaura las licencias", sub: "PS5: Ajustes › Usuarios y cuentas › Otros › Restaurar licencias"}
      - {text: "Mira el estado de PlayStation Network o Xbox", sub: "El día de salida los servidores van al límite"}
      - {text: "Reinicia del todo la consola", sub: "Apágala por completo, no en modo reposo"}
    say:
      - "Si con eso no basta, vamos con las otras tres."
      - "Cuatro: restaura las licencias. En PS5 está en Ajustes, Usuarios y cuentas, Otros, Restaurar licencias. En Xbox, cerrar sesión y volver a entrar suele hacer lo mismo."
      - "Cinco: mira el estado de PlayStation Network o de Xbox. El día de lanzamiento de un juego así los servidores van al límite y la comprobación de licencia puede tardar."
      - "Y seis: apaga la consola del todo, nada de modo reposo, espera unos segundos y vuelve a encenderla. Parece una tontería, pero resuelve más casos de los que crees."
  - type: quote
    label: "Disco físico"
    text: "Aunque tengas el disco, la consola instalará datos y puede pedirte la actualización."
    detail: "Ten paciencia con la primera instalación"
    color: [40, 230, 255]
    say:
      - "Y si has comprado la edición física, ojo: el disco no te libra de esperar. La consola tiene que instalar los datos y casi seguro te pedirá descargar la actualización antes de jugar."
      - "Así que deja la consola conectada y ten paciencia con esa primera instalación."
  - type: stat
    chapter: "Bonus de reserva"
    kicker: "Antes de que se acabe"
    heading: "Bonus de reserva digital"
    value: "Vintage Vice City"
    size: 150
    label: "Disponible para compras digitales hasta el 19 de noviembre"
    detail: "Coche Vapid Stanier del 55 y garaje · ropa · patrón de arma · 1 mes de GTA+"
    source: "Rockstar Games Support · Microsoft Store"
    say:
      - "Un último detalle: si aún no lo has comprado, el pack de reserva digital, el Vintage Vice City, se incluye en compras digitales hechas antes del veinte de noviembre según Rockstar."
      - "Trae un coche Vapid Stanier del cincuenta y cinco con su garaje, ropa y peinados, un patrón de arma exclusivo y un mes de GTA+. La tienda de Microsoft habla de compras hasta el final del día diecinueve, así que, por si acaso, no lo dejes para mañana."
  - type: outro
    chapter: "Final"
    title: "¿Ya estás dentro?"
    next: "¿Cuánto pesa GTA 6? Espacio exacto y cómo liberar sitio"
    say:
      - "Y eso es todo. Si ya estás jugando, disfrútalo."
      - "Si te ha servido, suscríbete, porque esta semana voy a subir guías de GTA 6 cada día."
      - "Y en el próximo vídeo te cuento cuánto ocupa exactamente y cómo liberar espacio sin perder tus partidas."
