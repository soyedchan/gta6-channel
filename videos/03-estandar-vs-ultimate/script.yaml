meta:
  title: "GTA 6 Estándar vs Ultimate: ¿cuál COMPRAR ahora? Precio, qué incluye y el truco de la mejora por 20 €"
  description: |
    ¿Merece la pena la Ultimate Edition de GTA 6 ahora que el juego ya está a la venta? Comparamos precio (España, México y EE. UU.) y lo que incluye cada edición. También te explico por qué puedes comprar la Estándar y mejorar a Ultimate más adelante pagando lo mismo.
  tags: [gta 6 ultimate edition, gta 6 precio, gta 6 estandar vs ultimate, cuanto cuesta gta 6, gta 6 precio españa, gta 6 precio mexico, gta 6 ediciones, gta 6 vale la pena, gta 6 mejora ultimate, gta 6 upgrade, gta 6 fisico o digital, gta 6, gta vi]
  hashtags: ["#GTA6", "#GTAVI", "#GTA6Precio"]
  pinned: "¿Tú cuál tienes, Estándar o Ultimate? ¿Te arrepientes? 👇"
  endscreen: "¿GTA 6 sale en PC? Lo que se sabe"
thumb: {big: "¿CUÁL COMPRAR?", tag: "GTA 6 · EDICIONES", sticker: "+20 €"}
sources:
  - "Rockstar Games Support — Grand Theft Auto VI: plataformas, ediciones y versiones"
  - "Libertad Digital — Precios, ediciones y extras de GTA 6 (25/06/2026)"
  - "G2A News / Engadget — mejora de Estándar a Ultimate por 20 dólares (noviembre 2026)"
  - "Drohnen.de — GTA 6 Ultimate Edition upgrade en PS5 y Xbox (noviembre 2026)"
  - "Heraldo de México, ADN40 — precios en México (noviembre 2026)"
  - "OpenCritic / GamesRadar — GTA 6 se lanza sin modo online"
scenes:
  - type: title
    chapter: "Intro"
    kicker: "Antes de pagar"
    title: "ESTÁNDAR vs ULTIMATE"
    subtitle: "¿Cuál merece la pena ahora que ya ha salido?"
    say:
      - "GTA 6 ya está a la venta y la pregunta sigue ahí: ¿me compro la Estándar o la Ultimate?"
      - "Te comparo precio y contenido, y te cuento un truco para no equivocarte: puedes empezar por la barata y mejorar después sin pagar de más."
  - type: table
    chapter: "Precios"
    kicker: "Precios oficiales"
    heading: "Lo que cuesta"
    rows:
      - ["España · Estándar", "79,99 €"]
      - ["España · Ultimate", "99,99 €", true]
      - ["México (Xbox) · Estándar", "1.499 MXN"]
      - ["México (Xbox) · Ultimate", "1.879 MXN", true]
      - ["EE. UU. · Estándar / Ultimate", "79,99 / 99,99 USD"]
    at: [1, 1, 2, 2, 3]
    source: "Libertad Digital · Heraldo de México · ADN40 · tiendas oficiales"
    say:
      - "Vamos con los precios."
      - "En España, la edición Estándar cuesta setenta y nueve con noventa y nueve euros, y la Ultimate, noventa y nueve con noventa y nueve."
      - "En México, en la tienda de Xbox, la Estándar sale por mil cuatrocientos noventa y nueve pesos y la Ultimate por mil ochocientos setenta y nueve. En PlayStation el precio final es muy parecido."
      - "Y en Estados Unidos, setenta y nueve con noventa y nueve y noventa y nueve con noventa y nueve dólares. La diferencia, en resumen, son unos veinte euros o veinte dólares."
  - type: compare
    chapter: "Qué incluye cada una"
    kicker: "Qué te llevas"
    heading: "Qué incluye cada edición"
    columns:
      - title: "Estándar"
        price: "79,99 €"
        items: ["El juego completo", "Toda la historia de Lucía y Jason", "Todo el mapa de Leonida", "En digital y en disco"]
      - title: "Ultimate"
        price: "99,99 €"
        items: ["El juego completo", "Vehículos y armas extra", "Negocios de personalización", "Actividades y misiones secundarias extra", "Solo en digital"]
    say:
      - "¿Y qué cambia?"
      - "La Estándar es el juego completo: toda la historia, todo el mapa, todo lo importante. Y es la única que puedes comprar en disco."
      - "La Ultimate es el mismo juego con contenido extra. Según la prensa especializada, incluye vehículos y armas adicionales, negocios de personalización y varias actividades y misiones secundarias más. Es solo digital."
  - type: quote
    chapter: "Ojo con el online"
    label: "Importante"
    text: "GTA 6 ha salido sin modo online: los extras de la Ultimate son para la historia."
    detail: "Rockstar aún no ha dado fecha para el online"
    color: [40, 230, 255]
    say:
      - "Y un detalle que cambia las cosas: GTA 6 ha salido sin modo online. Rockstar lo presenta como una experiencia para un jugador y todavía no hay fecha para el online."
      - "Así que no pagues la Ultimate pensando en el online. Lo que compras son extras para la historia y el mundo abierto."
  - type: stat
    chapter: "El truco de la mejora"
    kicker: "El truco"
    heading: "Mejora más tarde"
    count: 20
    value: "+20 €"
    prefix: "+"
    suffix: " €"
    label: "Mejora de Estándar a Ultimate"
    detail: "Ya está a la venta como complemento · el precio puede variar según tienda y región"
    source: "G2A News · Engadget · Drohnen.de"
    say:
      - "Y aquí va el truco. La mejora de Estándar a Ultimate se vende por separado, por unos veinte euros o veinte dólares, según la tienda."
      - "Es decir, si compras la Estándar y más adelante te apetece el contenido extra, pagas la diferencia y acabas gastando lo mismo que si hubieras comprado la Ultimate desde el principio."
  - type: compare
    chapter: "Mi recomendación"
    kicker: "Mi recomendación"
    heading: "¿Cuál compro?"
    columns:
      - title: "Compra la Estándar si..."
        items: ["Vas a por la historia", "Quieres el juego en disco", "No sabes si te van a gustar los extras", "Prefieres decidir más adelante"]
      - title: "Compra la Ultimate si..."
        items: ["Te encanta coleccionar coches y armas", "Quieres exprimir todo el mundo abierto", "Vas a comprar en digital de todas formas", "Sabes que vas a jugarlo mucho"]
    vs: false
    say:
      - "Mi recomendación es sencilla."
      - "Para casi todo el mundo, la Estándar. Te llevas el juego completo, puedes tenerlo en disco, y si luego quieres los extras, mejoras por unos veinte euros."
      - "Compra la Ultimate directamente solo si ya sabes que te encanta coleccionar vehículos y armas, vas a exprimir el mundo abierto y vas a comprar en digital de todas formas."
  - type: quote
    label: "Si tienes el disco"
    text: "Comprueba en tu tienda si la mejora está disponible para la versión física."
    detail: "Las fuentes no coinciden en este punto"
    color: [255, 214, 64]
    say:
      - "Y si tienes la edición en disco, ojo: la información sobre si puedes comprar la mejora a Ultimate no está del todo clara. Compruébalo en la tienda de tu consola antes de pagar."
  - type: outro
    chapter: "Final"
    title: "¿Cuál tienes tú?"
    next: "¿GTA 6 sale en PC? Todo lo que se sabe"
    say:
      - "Cuéntame en los comentarios cuál tienes y si te arrepientes."
      - "Si te ha ayudado, suscríbete."
      - "Y en el próximo vídeo, la pregunta de los jugadores de PC: ¿cuándo llega GTA 6 a ordenador?"
