  title: "GTA 6 Estándar vs Ultimate: ¿cuál COMPRAR? Precio en España y México y qué incluye cada una"
  description: |
    ¿Merece la pena la Ultimate Edition de GTA 6? Comparamos precio (España, México y EE. UU.), contenido, el bonus de reserva Vintage Vice City y te digo cuál comprar según cómo vayas a jugar.
  tags: [gta 6 ultimate edition, gta 6 precio, gta 6 estandar vs ultimate, cuanto cuesta gta 6, gta 6 precio españa, gta 6 precio mexico, gta 6 ediciones, gta 6 vale la pena, gta 6 bonus reserva, vintage vice city pack, gta 6 fisico o digital, gta 6, gta vi]
  hashtags: ["#GTA6", "#GTAVI", "#GTA6Precio"]
  pinned: "¿Tú cuál has pillado, Estándar o Ultimate? 👇"
  endscreen: "¿GTA 6 sale en PC? Lo que se sabe"
