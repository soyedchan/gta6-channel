  title: "Lucía y Jason: QUIÉNES SON los protagonistas de GTA 6 (y el resto de personajes) — SIN SPOILERS"
  description: |
    Te presento a Lucía Caminos y Jason Duval, la pareja protagonista de GTA 6, y a los personajes secundarios que Rockstar enseñó antes del lanzamiento: Cal Hampton, Boobie Ike, Dre'Quan Priest, Real Dimez, Raul Bautista y Brian Heder. Solo con información oficial previa al lanzamiento, sin spoilers de la historia.
