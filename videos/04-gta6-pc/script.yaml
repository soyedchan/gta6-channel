meta:
  title: "¿GTA 6 sale en PC? Lo que se SABE, lo que es RUMOR y cuidado con las descargas falsas"
  description: |
    GTA 6 sale en PS5 y Xbox Series X|S, pero ¿y en PC? Repasamos lo que ha dicho Rockstar, cuánto tardaron GTA IV, GTA V y Red Dead Redemption 2 en llegar a ordenador, los rumores de 2027 y cómo evitar las estafas de "GTA 6 PC descarga".
  tags: [gta 6 pc, gta 6 pc fecha, gta 6 en pc, cuando sale gta 6 en pc, gta 6 pc requisitos, gta 6 steam, gta 6 pc descargar, gta 6 pc 2027, gta 6 pc rumores, gta 6 estafa, gta 6, gta vi pc]
  hashtags: ["#GTA6", "#GTA6PC", "#PCGaming"]
  pinned: "Jugadores de PC: ¿esperáis o os pilláis consola? 👇"
  endscreen: "¿En qué consolas funciona GTA 6?"
thumb: {big: "¿Y EN PC?", tag: "GTA 6 · PC", sticker: "¿2027?"}
sources:
  - "Rockstar Games Support — plataformas de Grand Theft Auto VI"
  - "Forbes — sin fecha de PC confirmada (16/11/2026)"
  - "Fechas históricas de lanzamiento de GTA IV, GTA V y Red Dead Redemption 2 en PC (Rockstar Newswire)"
scenes:
  - type: title
    chapter: "Intro"
    kicker: "La pregunta del millón"
    title: "¿GTA 6 EN PC?"
    subtitle: "Lo que se sabe y lo que es rumor"
    say:
      - "Si juegas en PC, hoy no es tu día. GTA 6 ha salido solo en consolas."
      - "Vamos a ver qué hay de verdad sobre la versión de ordenador, cuánto podría tardar según la historia de Rockstar, y una advertencia muy importante sobre las descargas falsas."
  - type: compare
    chapter: "Lo oficial"
    kicker: "Lo oficial a día de hoy"
    heading: "Plataformas confirmadas"
    columns:
      - title: "Confirmado"
        items: ["PlayStation 5", "Xbox Series X", "Xbox Series S", "Lanzamiento: 19 de noviembre de 2026"]
      - title: "Sin fecha"
        items: ["PC (Steam, Epic, Rockstar Launcher)", "Ninguna fecha oficial", "Rockstar no ha dado detalles", "Todo lo demás es rumor"]
    source: "Rockstar Games Support · Forbes"
    say:
      - "Lo oficial es esto."
      - "GTA 6 está confirmado en PlayStation 5 y en Xbox Series X y Series S, desde el diecinueve de noviembre."
      - "La versión de PC no tiene fecha. Rockstar no ha anunciado ni fecha ni requisitos, así que cualquier fecha concreta que veas por ahí es, por ahora, un rumor."
  - type: timeline
    chapter: "Lo que dice la historia"
    kicker: "Cuánto tardó Rockstar antes"
    heading: "De consola a PC"
    events:
      - {date: "GTA IV", text: "Consolas abril 2008 · PC diciembre 2008 (7 meses)"}
      - {date: "GTA V", text: "Consolas septiembre 2013 · PC abril 2015 (19 meses)"}
      - {date: "Red Dead 2", text: "Consolas octubre 2018 · PC noviembre 2019 (1 año)"}
    say:
      - "Pero la historia de Rockstar nos da pistas."
      - "GTA IV salió en consolas en abril de dos mil ocho y llegó a PC en diciembre de ese año. Unos siete meses después."
      - "GTA V tardó bastante más: salió en septiembre de dos mil trece y la versión de PC llegó en abril de dos mil quince. Diecinueve meses."
      - "Y Red Dead Redemption 2 salió en octubre de dos mil dieciocho y llegó a PC en noviembre de dos mil diecinueve. Algo más de un año."
  - type: stat
    chapter: "Los rumores"
    kicker: "Haciendo cuentas"
    heading: "Si se repite el patrón"
    value: "2027"
    label: "La ventana más probable para PC"
    detail: "Hay informes que apuntan a principios de 2027 · no es oficial"
    source: "Estimación propia basada en lanzamientos anteriores"
    say:
      - "Si Rockstar repite su patrón de entre siete y diecinueve meses, la versión de PC caería en algún momento de dos mil veintisiete."
      - "Algún informe de la industria habla incluso de principios de dos mil veintisiete, pero no hay nada confirmado. Tómalo como una estimación, no como una fecha."
  - type: quote
    chapter: "Cuidado con las estafas"
    label: "Peligro"
    text: "No existe ninguna descarga de GTA 6 para PC. Si la ves, es una estafa o un virus."
    detail: "Ni \"versiones filtradas\", ni \"beta para PC\", ni \"emuladores\""
    color: [255, 70, 80]
    say:
      - "Y ahora lo más importante del vídeo. No existe ninguna descarga de GTA 6 para PC. Ninguna."
      - "Cada lanzamiento grande trae páginas y vídeos con supuestas versiones filtradas, betas o emuladores. Todo eso son estafas para robarte cuentas o meterte malware. No descargues nada de eso."
  - type: checklist
    chapter: "Qué hacer mientras tanto"
    kicker: "Si solo tienes PC"
    heading: "Qué puedes hacer mientras"
    items:
      - {text: "Sigue solo los canales oficiales de Rockstar", sub: "La fecha de PC saldrá en su web y en sus redes"}
      - {text: "No compres claves de PC de webs dudosas", sub: "Hoy no existe ninguna clave legítima para PC"}
      - {text: "Evita los spoilers", sub: "Silencia palabras clave en redes los primeros días"}
    say:
      - "¿Qué puedes hacer mientras tanto?"
      - "Primero, sigue solo los canales oficiales de Rockstar. La fecha de PC se anunciará ahí."
      - "Segundo, no compres claves de PC en webs dudosas. Hoy no existe ninguna clave legítima de GTA 6 para ordenador."
      - "Y tercero, protégete de los spoilers. Silencia palabras clave en redes, porque la historia va a estar por todas partes estos días."
  - type: outro
    chapter: "Final"
    title: "¿Esperas o te pasas a consola?"
    next: "¿En qué consolas funciona GTA 6? PS4, Series S y PS5 Pro"
    say:
      - "Cuéntame en los comentarios si vas a esperar a la versión de PC o te pasas a consola."
      - "Suscríbete y activa la campana: en cuanto Rockstar diga algo de PC, lo tendrás aquí."
      - "Y en el próximo vídeo, qué consolas pueden mover GTA 6 y cuáles no."
